#   conda env create -f environment.yaml
#   conda activate jaxrl

name: jaxrl
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - jupyterlab=4.6
  - ipykernel=7.3
  - pip:
      # JAX ecosystem
      - jax[cuda12]==0.10.2
      - flax==0.12.8
      - optax==0.2.8
      - grain==0.2.18
      - gymnax==0.0.9
      # Other dependencies
      - numpy==2.4.6
      - matplotlib==3.11.1
      - scikit-learn==1.9.0
      # Rendering episodes in notebooks
      - gymnasium==1.1.1
      - pillow==12.3.0
